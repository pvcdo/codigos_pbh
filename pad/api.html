<script>

/**
 * ============================================================
 * api.html
 * Comunicação Frontend ↔ Apps Script
 * ============================================================
 */


const API = {

    listarProcessos(dados){

        return new Promise((resolve,reject)=>{

            google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .listarProcessos(
                dados.pagina,
                dados.tamanhoPagina,
                dados.filtro
            );

        });

    },

    /**
     * Busca processo pelo PDG ou ID
     */
    buscarProcesso(dados){

        return new Promise((resolve,reject)=>{


            google.script.run

            .withSuccessHandler(function(resposta){

                resolve(resposta);

            })

            .withFailureHandler(function(erro){

                reject(erro);

            })

            .buscarProcesso(
                dados.valor,
                dados.tipo
            );


        });


    },




    /**
     * Busca servidor pelo BM
     */
    buscarServidor(bm){


        return new Promise((resolve,reject)=>{


            google.script.run

            .withSuccessHandler(function(resposta){

                resolve(resposta);

            })


            .withFailureHandler(function(erro){

                reject(erro);

            })


            .buscarServidorPorBM(bm);



        });


    },





    /**
     * Realiza o cadastro
     */
    cadastrarProcesso(dados){


        return new Promise((resolve,reject)=>{


            google.script.run

            .withSuccessHandler(function(resposta){

                resolve(resposta);

            })


            .withFailureHandler(function(erro){

                reject(erro);

            })


            .cadastrarProcesso(dados);



        });


    },

    atualizarProcesso(dados, linhaBase){

        return new Promise((resolve,reject)=>{

            google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .atualizarProcesso(dados, linhaBase);

        });

    },





    /**
     * Carrega listas do sistema
     */
    carregarListas(){


        return new Promise((resolve,reject)=>{


            google.script.run

            .withSuccessHandler(function(resposta){

                resolve(resposta);

            })


            .withFailureHandler(function(erro){

                reject(erro);

            })


            .getListasFormulario();



        });


    },





    /**
     * Busca data atual
     */
    hoje(){


        return new Promise((resolve,reject)=>{


            google.script.run

            .withSuccessHandler(function(resposta){

                resolve(resposta);

            })


            .withFailureHandler(function(erro){

                reject(erro);

            })


            .getDataAtual();



        });


    }



};


</script>
