<script>

/**
 * ============================================================
 * api.html
 * Comunicação Frontend ↔ Apps Script
 * ============================================================
 */

const TEMPO_LIMITE_CHAMADA_MS = 45000;

function chamarServidor(funcao, argumentos, tempoLimite){

    return new Promise((resolve, reject)=>{

        let concluida = false;
        const timeout = tempoLimite === 0
            ? null
            : window.setTimeout(()=>{
                concluida = true;
                reject(new Error("A solicitação ao servidor excedeu 45 segundos. Tente novamente."));
            }, TEMPO_LIMITE_CHAMADA_MS);

        const runner = google.script.run
            .withSuccessHandler(function(resposta){
                if(concluida)
                    return;

                concluida = true;
                if(timeout !== null)
                    window.clearTimeout(timeout);
                resolve(resposta);
            })
            .withFailureHandler(function(erro){
                if(concluida)
                    return;

                concluida = true;
                if(timeout !== null)
                    window.clearTimeout(timeout);
                reject(erro);
            });

        try{
            runner[funcao](...argumentos);
        }catch(erro){
            concluida = true;
            if(timeout !== null)
                window.clearTimeout(timeout);
            reject(erro);
        }

    });

}

const API = {

    carregarDadosIniciais(){
        return chamarServidor("carregarDadosIniciais", []);
    },

    listarProcessos(dados){
        return chamarServidor("listarProcessos", [
            dados.pagina,
            dados.tamanhoPagina,
            dados.filtro
        ]);
    },

    buscarProcesso(dados){
        return chamarServidor("buscarProcesso", [
            dados.valor,
            dados.tipo
        ]);
    },

    buscarServidor(bm){
        return chamarServidor("buscarServidorPorBM", [bm]);
    },

    cadastrarProcesso(dados){
        return chamarServidor("cadastrarProcesso", [dados], 0);
    },

    atualizarProcesso(dados, linhaBase){
        return chamarServidor("atualizarProcesso", [dados, linhaBase], 0);
    },

    carregarListas(){
        return chamarServidor("getListasFormulario", []);
    },

    hoje(){
        return chamarServidor("getDataAtual", []);
    }

};


</script>
