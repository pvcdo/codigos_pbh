<style>

:root{

    --primary:#1a73e8;
    --primary-hover:#1765c1;

    --success:#34a853;
    --danger:#ea4335;

    --background:#f4f6fb;

    --card:#ffffff;

    --border:#dfe3eb;

    --text:#202124;

    --subtitle:#5f6368;

    --shadow:0 8px 24px rgba(0,0,0,.08);

    --radius:12px;

}

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

    font-family:'Inter',sans-serif;

}

body{

    background:var(--background);

    color:var(--text);

    padding:30px;

}

.container{

    max-width:1200px;

    margin:auto;

}

.topo{

    margin-bottom:25px;

}

.topo h1{

    font-size:30px;

    font-weight:700;

}

.topo p{

    margin-top:6px;

    color:var(--subtitle);

}

.card{

    background:white;

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    padding:35px;

}

.grid-1{

    display:grid;

    grid-template-columns:1fr;

    gap:20px;

    margin-bottom:20px;

}

.grid-2{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

    margin-bottom:20px;

}

.grid-3{

    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:20px;

    margin-bottom:20px;

}

.campo{

    display:flex;

    flex-direction:column;

}

label{

    font-size:13px;

    color:#666;

    margin-bottom:8px;

    font-weight:600;

}

input,
select,
textarea{

    width:100%;

    border:1px solid var(--border);

    border-radius:10px;

    padding:12px 14px;

    font-size:14px;

    transition:.2s;

    outline:none;

    background:white;

}

textarea{

    resize:vertical;

    min-height:120px;

}

input:focus,
select:focus,
textarea:focus{

    border-color:var(--primary);

    box-shadow:0 0 0 3px rgba(26,115,232,.15);

}

input[readonly]{

    background:#f7f8fa;

    color:#444;

}

.acoes{

    display:flex;

    justify-content:flex-end;

    gap:15px;

    margin-top:30px;

}

button{

    border:none;

    border-radius:10px;

    padding:13px 30px;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    transition:.2s;

}

button:hover{

    transform:translateY(-2px);

}

.primary{

    background:var(--primary);

    color:white;

}

.primary:hover{

    background:var(--primary-hover);

}

#btnNovo{

    background:#eceff3;

}

#btnNovo:hover{

    background:#dde3ea;

}

.loading{

    position:fixed;

    inset:0;

    background:rgba(255,255,255,.75);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:9999;

    backdrop-filter:blur(2px);

}

.spinner{

    width:60px;

    height:60px;

    border:6px solid #ddd;

    border-top:6px solid var(--primary);

    border-radius:50%;

    animation:girar .8s linear infinite;

}

@keyframes girar{

    from{

        transform:rotate(0deg);

    }

    to{

        transform:rotate(360deg);

    }

}

#toast{

    position:fixed;

    right:30px;

    bottom:30px;

    min-width:280px;

    padding:16px 20px;

    border-radius:10px;

    color:white;

    font-weight:600;

    display:none;

    box-shadow:0 12px 30px rgba(0,0,0,.2);

    z-index:99999;

}

.toast-success{

    background:var(--success);

}

.toast-error{

    background:var(--danger);

}

.autocomplete{

    position:relative;

}

.autocomplete-items{

    position:absolute;

    top:100%;

    left:0;

    right:0;

    background:white;

    border:1px solid #ddd;

    max-height:260px;

    overflow-y:auto;

    border-radius:10px;

    box-shadow:0 10px 25px rgba(0,0,0,.15);

    z-index:999;

}

.autocomplete-item{

    padding:12px;

    cursor:pointer;

    transition:.15s;

    font-size:14px;

}

.autocomplete-item:hover{

    background:#edf3ff;

}

.tags-motivacao{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:10px;

}

.tag-motivacao{

    display:inline-flex;

    align-items:center;

    gap:8px;

    max-width:100%;

    padding:7px 10px;

    border-radius:999px;

    background:#edf3ff;

    color:#174ea6;

    font-size:13px;

}

.tag-motivacao span{

    overflow-wrap:anywhere;

}

.tag-motivacao button{

    padding:0;

    width:20px;

    height:20px;

    border-radius:50%;

    background:transparent;

    color:#174ea6;

    font-size:16px;

    line-height:1;

}

.tag-motivacao button:hover{

    transform:none;

    background:#d2e3fc;

}

.required::after{

    content:" *";

    color:#d93025;

}

.oculto{

    display:none !important;

}

.fade{

    animation:fade .25s;

}

@keyframes fade{

    from{

        opacity:0;

        transform:translateY(10px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

@media(max-width:900px){

    .grid-2{

        grid-template-columns:1fr;

    }

    .grid-3{

        grid-template-columns:1fr;

    }

    .acoes{

        flex-direction:column;

    }

    button{

        width:100%;

    }

    body{

        padding:15px;

    }

    .card{

        padding:20px;

    }

}

</style>
