<h1>Registrar novo evento</h1>
<form id="formEvento">
  <label>DATA DO EVENTO *
    <input name="DATA DO EVENTO" type="date" required>
  </label>
  <label>UNIDADES
    <div class="unidades-autocomplete" data-unidades-picker>
      <input type="text" data-unidades-input autocomplete="off"
        placeholder="Digite para pesquisar unidades" aria-autocomplete="list">
      <div data-unidades-sugestoes></div>
      <div class="tags-unidades" data-unidades-tags></div>
      <small data-unidades-erro role="status" aria-live="polite"></small>
      <input type="hidden" name="UNIDADES" data-unidades-valor>
    </div>
  </label>
  <fieldset class="wide calendarios-field">
    <legend>Calendário</legend>
    <div class="calendarios-opcoes" data-calendarios-picker>
      <label><input type="checkbox" data-calendario-option value="Calendário da Saúde MS"> Calendário da Saúde MS</label>
      <label><input type="checkbox" data-calendario-option value="Calendário de Cores MS"> Calendário de Cores MS</label>
      <label><input type="checkbox" data-calendario-option value="Calendário POEPS"> Calendário POEPS</label>
      <label><input type="checkbox" data-calendario-option value="Calendário Nacional"> Calendário Nacional</label>
      <input type="hidden" name="Calendário" data-calendarios-valor>
    </div>
  </fieldset>
  <label>TEMA *
    <div class="temas-autocomplete" data-temas-picker>
      <input type="text" data-temas-input autocomplete="off"
        placeholder="Digite para pesquisar temas" aria-autocomplete="list">
      <div data-temas-sugestoes></div>
      <div class="tags-unidades" data-temas-tags></div>
      <input type="hidden" name="TEMAS" data-temas-valor>
    </div>
  </label>
  <label>OBJETIVO
    <textarea name="OBJETIVO"></textarea>
  </label>
  <label>TIPO DE AÇÃO *
    <!-- <input name="TIPO DE AÇÃO" type="text"> -->
    <select name="TIPO DE AÇÃO" required>
      <option value="">Selecione</option>
      <option value="Roda de conversa">Roda de conversa</option>
      <option value="Bate papo com especialista">Bate papo com especialista</option>
    </select>
  </label>
  <label>ESPECIFICAÇÃO *
    <input name="ESPECIFICAÇÃO" type="text" required>
  </label>
  <label>ONLINE/PRESENCIAL
    <select name="ONLINE/PRESENCIAL">
      <option value="">Selecione</option>
      <option value="Online">Online</option>
      <option value="Presencial">Presencial</option>
    </select>
  </label>
  <!--<label>TOTAL DE PARTICIPANTES
    <input name="TOTAL DE PARTICIPANTES" type="number" min="0" step="1">
  </label>-->
  <label>Inscrições abertas 
    <input type="checkbox" id="novo_inscricoes_abertas" name="Inscrições abertas" checked>
  </label>

  <label class="wide">PARCEIROS
    <textarea name="PARCEIROS"></textarea>
  </label>
  <div class="actions wide">
    <button id="submitButton" type="submit">Salvar evento</button>
    <button class="cancel" onclick="mostrarLista()">Cancelar</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</form>
<script>
  const form = document.getElementById('formEvento');
  const submitButton = document.getElementById('submitButton');
  const status = document.getElementById('status');

  form.addEventListener('submit', function(event) {
    event.preventDefault();
    if (!form.elements['TEMAS'].value.trim()) {
      status.textContent = 'Selecione pelo menos um tema.';
      form.querySelector('[data-temas-input]').focus();
      return;
    }
    exibirLoading('Salvando evento...');
    submitButton.disabled = true;

    var dados = Object.fromEntries(new FormData(form).entries());

    // Busca o checkbox especificamente dentro do formulário atual (evita conflito com o formulário de edição)
    const cbx_insc = form.querySelector('input[name="Inscrições abertas"]');
    dados['Inscrições abertas'] = (cbx_insc && cbx_insc.checked) ? 'sim' : 'não';

    google.script.run
      .withSuccessHandler(function(eventosAtualizados) {
        ocultarLoading();
        submitButton.disabled = false;
        status.textContent = '';
        
        // Passa a lista atualizada enviada pelo servidor
        mostrarLista(eventosAtualizados);
      })
      .withFailureHandler(function(error) {
        ocultarLoading();
        status.textContent = error && error.message
          ? error.message
          : 'Não foi possível salvar o evento.';
        submitButton.disabled = false;
      })
      .salvarEvento(dados);
  });
</script>
