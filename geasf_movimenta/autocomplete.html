<script>
  (function() {
    const seletores = [];
    const seletoresTemas = [];
    let unidadesDisponiveis = [];
    const temasDisponiveis = [
      'Saúde Mental e Bem-Estar Emocional',
      'Violência, Proteção e Cultura de Paz',
      'Prevenção do Câncer e Diagnóstico Precoce',
      'Saúde Integral da Mulher',
      'Saúde do Homem',
      'Saúde Materno-Infantil e Proteção da Infância',
      'Saúde Sexual e Prevenção de ISTs',
      'Imunização e Prevenção de Doenças Transmissíveis',
      'Alimentação Saudável e Prevenção de Doenças Crônicas',
      'Saúde do Trabalhador e Segurança',
      'Prevenção de Acidentes e Segurança no Trânsito',
      'Envelhecimento Saudável e Proteção da Pessoa Idosa',
      'Doação de Sangue e Solidariedade',
      'Autocuidado, Direitos e Acesso à Saúde',
      'Saúde Ambiental e Prevenção de Doenças'
    ];
    const camposCalendario = [
      'Calendário da Saúde MS',
      'Calendário de Cores MS',
      'Calendário POEPS',
      'Calendário Nacional'
    ];

    function normalizar(texto) {
      return String(texto)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLocaleLowerCase();
    }

    function atualizarTemas(seletor) {
      seletor.valor.value = seletor.selecionados.join(', ');
    }

    function renderizarTagsTemas(seletor) {
      seletor.tags.replaceChildren();

      seletor.selecionados.forEach(function(tema, indice) {
        const tag = document.createElement('span');
        tag.className = 'tag-unidade';

        const texto = document.createElement('span');
        texto.textContent = tema;
        tag.appendChild(texto);

        const remover = document.createElement('button');
        remover.type = 'button';
        remover.textContent = '×';
        remover.title = 'Remover ' + tema;
        remover.setAttribute('aria-label', 'Remover ' + tema);
        remover.addEventListener('click', function() {
          seletor.selecionadas.splice(indice, 1);
          renderizarTagsTemas(seletor);
          seletor.entrada.focus();
        });
        tag.appendChild(remover);
        seletor.tags.appendChild(tag);
      });

      atualizarTemas(seletor);
    }

    function limparSugestoesTemas(seletor) {
      seletor.sugestoes.replaceChildren();
      seletor.indiceAtivo = -1;
    }

    function selecionarTema(seletor, tema) {
      if (!seletor.selecionadas.some(function(item) {
        return normalizar(item) === normalizar(tema);
      })) {
        seletor.selecionadas.push(tema);
        renderizarTagsTemas(seletor);
      }

      seletor.entrada.value = '';
      limparSugestoesTemas(seletor);
      seletor.entrada.focus();
    }

    function mostrarSugestoesTemas(seletor) {
      const termo = normalizar(seletor.entrada.value.trim());
      const resultados = temasDisponiveis.filter(function(tema) {
        return normalizar(tema).includes(termo) &&
          !seletor.selecionadas.some(function(selecionado) {
            return normalizar(selecionado) === normalizar(tema);
          });
      });

      limparSugestoesTemas(seletor);
      resultados.forEach(function(tema) {
        const opcao = document.createElement('div');
        opcao.className = 'temas-sugestao';
        opcao.textContent = tema;
        opcao.setAttribute('role', 'option');
        opcao.setAttribute('aria-selected', 'false');
        opcao.addEventListener('mousedown', function(evento) {
          evento.preventDefault();
          selecionarTema(seletor, tema);
        });
        seletor.sugestoes.appendChild(opcao);
      });
    }

    function inicializarTemas() {
      document.querySelectorAll('[data-temas-picker]').forEach(function(container) {
        const seletor = {
          entrada: container.querySelector('[data-temas-input]'),
          sugestoes: container.querySelector('[data-temas-sugestoes]'),
          tags: container.querySelector('[data-temas-tags]'),
          valor: container.querySelector('[data-temas-valor]'),
          selecionadas: [],
          indiceAtivo: -1
        };
        seletor.sugestoes.className = 'temas-sugestoes';
        seletoresTemas.push(seletor);

        seletor.entrada.addEventListener('input', function() {
          mostrarSugestoesTemas(seletor);
        });
        seletor.entrada.addEventListener('focus', function() {
          mostrarSugestoesTemas(seletor);
        });
        seletor.entrada.addEventListener('keydown', function(evento) {
          const opcoes = seletor.sugestoes.querySelectorAll('.temas-sugestao');
          if (evento.key === 'ArrowDown' && opcoes.length) {
            evento.preventDefault();
            seletor.indiceAtivo = (seletor.indiceAtivo + 1) % opcoes.length;
          } else if (evento.key === 'ArrowUp' && opcoes.length) {
            evento.preventDefault();
            seletor.indiceAtivo =
              (seletor.indiceAtivo - 1 + opcoes.length) % opcoes.length;
          } else if (evento.key === 'Enter' && seletor.indiceAtivo >= 0) {
            evento.preventDefault();
            selecionarTema(seletor, opcoes[seletor.indiceAtivo].textContent);
            return;
          } else if (evento.key === 'Escape') {
            limparSugestoesTemas(seletor);
            return;
          } else {
            return;
          }

          opcoes.forEach(function(opcao, indice) {
            const ativa = indice === seletor.indiceAtivo;
            opcao.setAttribute('aria-selected', String(ativa));
            if (ativa) opcao.scrollIntoView({ block: 'nearest' });
          });
        });

        container.addEventListener('click', function(evento) {
          evento.stopPropagation();
        });
      });
    }

    function inicializarCalendarios() {
      document.querySelectorAll('[data-calendarios-picker]').forEach(function(container) {
        const valor = container.querySelector('[data-calendarios-valor]');
        const opcoes = Array.from(container.querySelectorAll('[data-calendario-option]'));
        opcoes.forEach(function(opcao) {
          opcao.addEventListener('change', function() {
            valor.value = opcoes
              .filter(function(item) { return item.checked; })
              .map(function(item) { return item.value; })
              .join(', ');
          });
        });
      });
    }

    function atualizarValor(seletor) {
      seletor.valor.value = seletor.selecionadas.join(', ');
    }

    function renderizarTags(seletor) {
      seletor.tags.replaceChildren();

      seletor.selecionadas.forEach(function(unidade, indice) {
        const tag = document.createElement('span');
        tag.className = 'tag-unidade';

        const texto = document.createElement('span');
        texto.textContent = unidade;
        tag.appendChild(texto);

        const remover = document.createElement('button');
        remover.type = 'button';
        remover.textContent = '×';
        remover.title = 'Remover ' + unidade;
        remover.setAttribute('aria-label', 'Remover ' + unidade);
        remover.addEventListener('click', function() {
          seletor.selecionadas.splice(indice, 1);
          atualizarValor(seletor);
          renderizarTags(seletor);
          seletor.entrada.focus();
        });
        tag.appendChild(remover);
        seletor.tags.appendChild(tag);
      });

      atualizarValor(seletor);
    }

    function limparSugestoes(seletor) {
      seletor.sugestoes.replaceChildren();
      seletor.indiceAtivo = -1;
    }

    function selecionarUnidade(seletor, unidade) {
      if (!seletor.selecionadas.some(function(item) {
        return normalizar(item) === normalizar(unidade);
      })) {
        seletor.selecionadas.push(unidade);
        renderizarTags(seletor);
      }

      seletor.entrada.value = '';
      limparSugestoes(seletor);
      seletor.entrada.focus();
    }

    function mostrarSugestoes(seletor) {
      const termo = normalizar(seletor.entrada.value.trim());
      const resultados = unidadesDisponiveis.filter(function(unidade) {
        return normalizar(unidade).includes(termo) &&
          !seletor.selecionadas.some(function(selecionada) {
            return normalizar(selecionada) === normalizar(unidade);
          });
      }).slice(0, 20);

      limparSugestoes(seletor);
      resultados.forEach(function(unidade) {
        const opcao = document.createElement('div');
        opcao.className = 'unidades-sugestao';
        opcao.textContent = unidade;
        opcao.setAttribute('role', 'option');
        opcao.setAttribute('aria-selected', 'false');
        opcao.addEventListener('mousedown', function(evento) {
          evento.preventDefault();
          selecionarUnidade(seletor, unidade);
        });
        seletor.sugestoes.appendChild(opcao);
      });
    }

    function marcarOpcao(seletor) {
      const opcoes = seletor.sugestoes.querySelectorAll('.unidades-sugestao');
      opcoes.forEach(function(opcao, indice) {
        const ativa = indice === seletor.indiceAtivo;
        opcao.setAttribute('aria-selected', String(ativa));
        if (ativa) {
          opcao.scrollIntoView({ block: 'nearest' });
        }
      });
    }

    function inicializarSeletor(container) {
      const seletor = {
        entrada: container.querySelector('[data-unidades-input]'),
        sugestoes: container.querySelector('[data-unidades-sugestoes]'),
        tags: container.querySelector('[data-unidades-tags]'),
        erro: container.querySelector('[data-unidades-erro]'),
        valor: container.querySelector('[data-unidades-valor]'),
        selecionadas: [],
        indiceAtivo: -1
      };

      seletor.sugestoes.className = 'unidades-sugestoes';
      seletor.entrada.disabled = true;
      seletores.push(seletor);

      seletor.entrada.addEventListener('input', function() {
        mostrarSugestoes(seletor);
      });
      seletor.entrada.addEventListener('focus', function() {
        mostrarSugestoes(seletor);
      });
      seletor.entrada.addEventListener('keydown', function(evento) {
        const opcoes = seletor.sugestoes.querySelectorAll('.unidades-sugestao');
        if (evento.key === 'ArrowDown' && opcoes.length) {
          evento.preventDefault();
          seletor.indiceAtivo = (seletor.indiceAtivo + 1) % opcoes.length;
          marcarOpcao(seletor);
        } else if (evento.key === 'ArrowUp' && opcoes.length) {
          evento.preventDefault();
          seletor.indiceAtivo =
            (seletor.indiceAtivo - 1 + opcoes.length) % opcoes.length;
          marcarOpcao(seletor);
        } else if (evento.key === 'Enter' && seletor.indiceAtivo >= 0) {
          evento.preventDefault();
          selecionarUnidade(seletor, opcoes[seletor.indiceAtivo].textContent);
        } else if (evento.key === 'Escape') {
          limparSugestoes(seletor);
        }
      });

      container.addEventListener('click', function(evento) {
        evento.stopPropagation();
      });
    }

    window.definirUnidadesSelecionadas = function(formulario, valor) {
      const container = formulario.querySelector('[data-unidades-picker]');
      const seletor = seletores.find(function(item) {
        return item.entrada.closest('[data-unidades-picker]') === container;
      });
      if (!seletor) return;

      const unidades = String(valor || '')
        .split(',')
        .map(function(unidade) { return unidade.trim(); })
        .filter(Boolean);
      seletor.selecionadas = [];
      unidades.forEach(function(unidade) {
        const existente = seletor.selecionadas.some(function(item) {
          return normalizar(item) === normalizar(unidade);
        });
        if (!existente) seletor.selecionadas.push(unidade);
      });
      seletor.entrada.value = '';
      renderizarTags(seletor);
    };

    window.definirTemasSelecionados = function(formulario, valor) {
      const container = formulario.querySelector('[data-temas-picker]');
      const seletor = seletoresTemas.find(function(item) {
        return item.entrada.closest('[data-temas-picker]') === container;
      });
      if (!seletor) return;

      seletor.selecionadas = [];
      String(valor || '')
        .split(',')
        .map(function(tema) { return tema.trim(); })
        .filter(Boolean)
        .forEach(function(tema) {
          const existente = seletor.selecionadas.some(function(item) {
            return normalizar(item) === normalizar(tema);
          });
          if (!existente) seletor.selecionadas.push(tema);
        });
      seletor.entrada.value = '';
      renderizarTagsTemas(seletor);
    };

    window.definirCalendariosSelecionados = function(formulario, evento) {
      const container = formulario.querySelector('[data-calendarios-picker]');
      if (!container) return;

      const valor = container.querySelector('[data-calendarios-valor]');
      const opcoes = Array.from(container.querySelectorAll('[data-calendario-option]'));
      let selecionados = String(evento.Calendário || '')
        .split(',')
        .map(function(calendario) { return calendario.trim(); })
        .filter(Boolean);

      if (!selecionados.length) {
        selecionados = camposCalendario.filter(function(campo) {
          return String(evento[campo] || '').trim();
        });
      }

      opcoes.forEach(function(opcao) {
        opcao.checked = selecionados.some(function(calendario) {
          return normalizar(calendario) === normalizar(opcao.value);
        });
      });
      valor.value = selecionados.join(', ');
    };

    document.addEventListener('click', function() {
      seletores.forEach(limparSugestoes);
      seletoresTemas.forEach(limparSugestoesTemas);
    });

    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('[data-unidades-picker]').forEach(inicializarSeletor);
      inicializarTemas();
      inicializarCalendarios();

      google.script.run
        .withSuccessHandler(function(unidades) {
          if (!Array.isArray(unidades)) {
            seletores.forEach(function(seletor) {
              seletor.erro.textContent = 'A lista de unidades retornada pelo servidor é inválida.';
            });
            return;
          }
          unidadesDisponiveis = unidades
            .map(function(unidade) { return String(unidade).trim(); })
            .filter(Boolean);
          seletores.forEach(function(seletor) {
            seletor.entrada.disabled = false;
          });
        })
        .withFailureHandler(function(erro) {
          seletores.forEach(function(seletor) {
            seletor.erro.textContent = erro && erro.message
              ? erro.message
              : 'Não foi possível carregar as unidades.';
          });
        })
        .carregarUnidades();
    });
  })();
</script>
