        margin-bottom: 20px;
      }
      .closed-card {
        background: #fdf2f2;
        border: 1px solid #f8b4b4;
        border-radius: 8px;
        padding: 32px 24px;
        text-align: center;
      }
      .closed-card h2 {
        color: #9a271e;
        margin-top: 0;
      }
      .field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }
      label {
        font-weight: bold;
        font-size: 14px;
      }
      input[readonly] {
        background-color: #f3f6f7;
        color: #586875;

        cursor: not-allowed;

      input {
        border: 1px solid #aab6bf;
        border-radius: 4px;
        box-sizing: border-box;

  <body>

    <? if (!inscricoesAbertas) { ?>
      <!-- Tela exibida quando o campo "Inscrições abertas" NÃO for "sim" -->
      <div class="closed-card">
        <h2>Inscrições Indisponíveis</h2>
        <p><?= mensagemErro ?></p>
      </div>
    <? } else { ?>
      <!-- Tela de Inscrição quando as inscrições estão abertas -->
      <div class="card">
        <h1>Registro de Presença</h1>

        <p id="aviso">A lista de presença tem por objetivo fazer levantamentos estatísticos sobre os eventos promovidos pela GEASF/SMSA, <b>não ensejando em certificação ou carga horária de cursos</b>.</p>
        
        <form id="formPresenca">
          <input type="hidden" name="id_evento" value="<?= evento.id_evento ?>">

          <!-- Campos NÃO editáveis com dados do evento -->
          <div class="field-group">
            <label>Especificação do Evento</label>
            <input type="text" value="<?= evento['ESPECIFICAÇÃO'] ?>" readonly disabled>
          </div>

          <div class="field-group">
            <label>Data do Evento</label>
            <input type="text" value="<?= evento['DATA DO EVENTO'] ?>" readonly disabled>
          </div>

          <hr style="border: 0; border-top: 1px solid #dce3e8; margin: 20px 0;">

          <!-- Campos EDITÁVEIS para dados do participante -->
          <div class="field-group">
            <label for="matricula">Matrícula *</label>
            <input type="text" id="matricula" name="matricula" required placeholder="Digite sua matrícula">
          </div>

          <div class="field-group">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
          </div>

          <div class="field-group">
            <label for="unidade">Unidade *</label>
            <input type="text" id="unidade" name="unidade" required placeholder="Digite sua unidade">
          </div>

          <button id="btnSubmit" type="submit">Confirmar Presença</button>
          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </div>

      <script>
        const form = document.getElementById('formPresenca');
        const btnSubmit = document.getElementById('btnSubmit');
        const status = document.getElementById('status');

        form.addEventListener('submit', function(event) {
          event.preventDefault();
          btnSubmit.disabled = true;
          status.className = '';
          status.textContent = 'Registrando presença...';

          const dados = Object.fromEntries(new FormData(form).entries());

          google.script.run
            .withSuccessHandler(function() {
              status.className = 'success';
              status.textContent = 'Presença registrada com sucesso!';
              form.reset();
              btnSubmit.disabled = false;
            })
            .withFailureHandler(function(error) {
              status.className = 'error';
              status.textContent = error && error.message 
                ? error.message 
                : 'Não foi possível registrar a presença.';
              btnSubmit.disabled = false;
            })
            .registrarPresenca(dados);
        });
      </script>
    <? } ?>

  </body>
</html>
